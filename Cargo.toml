[package]
name = "show-your-key"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", default-features = false, features = ["font-kit", "windows-manifest"] }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.9" }
gpui-component = { version = "0.7.3", default-features = false }
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
winresource = "0.1"

# 体积优化：opt-level="z"（体积优先）+ fat LTO + 单一 codegen 单元 + panic=abort + strip。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
