[package]
name = "show-your-key"
version = "0.2.0"
edition = "2021"

[dependencies]
gpui-kit = { version = "0.7.3", default-features = false, features = ["component", "assets"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
] }

[build-dependencies]
winresource = "0.1"

# 体积优化：opt-level="z"（体积优先）+ fat LTO + 单一 codegen 单元 + panic=abort + strip。
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
